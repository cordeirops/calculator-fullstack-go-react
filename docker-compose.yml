services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    ports:
      - "5173:80"
    depends_on:
      - backend
